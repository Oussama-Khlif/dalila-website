{% block content %}
{% load static %}

<div class="modal fade" id="advanceModal" tabindex="-1" aria-labelledby="advanceModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content" style="background-color: transparent; border: none;">
      <form id="advanceForm" method="POST" action="{% url 'update_advance' %}" style="padding:0;">
        <div class="modal-header">
          <h5 class="modal-title" id="advanceModalLabel">Mettre à jour le solde client</h5>
          <button type="button" class="btn-close close-btn" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        {% csrf_token %}
        <div class="modal-body">
          <div class="form-group" style="text-align: center; margin-bottom:0px;">
            <img src="{% static 'images/money.png' %}" alt="Alert Image" style="width: 100px; height: 100px; object-fit: cover; margin: 0 auto;" />
        </div>
          <input type="hidden" name="matricule" value="{{ profile.matricule }}">
          <div class="mb-3">
            <label for="advanceAmount" class="form-label">Montant</label>
            <input type="number" step="0.01" class="form-control" id="advanceAmount" placeholder="Tapez le montant ici" name="advance" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success" name="action" value="add">
            <i class="fa fa-plus"></i> Ajouter
          </button>
          <button type="submit" class="btn btn-danger" name="action" value="subtract">
            <i class="fa fa-undo"></i> Rembourser
          </button>                 
        </div>
      </form>
    </div>
  </div>
</div>


<style>
  .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      padding-top: 60px;
  }

  .modal-content {
      background-color: transparent; 
      border: none; 
      margin: 15% auto;
      width: 100%; 
  }

  .close-btn {
      color: #aaa;
      font-size: 15px;
      font-weight: bold;
      position: absolute;
      top: 10px;
      right: 25px;
      cursor: pointer;
  }

  .close-btn:hover,
  .close-btn:focus {
      color: black;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const advanceForm = document.getElementById("advanceForm");

    advanceForm.addEventListener("submit", function (event) {
      const action = event.submitter.getAttribute("value");
      
      let confirmationMessage;
      if (action === "add") {
        confirmationMessage = "Êtes-vous sûr de vouloir ajouter ce montant ?";
      } else if (action === "subtract") {
        confirmationMessage = "Êtes-vous sûr de vouloir rembourser ce montant ?";
      }

      if (!confirm(confirmationMessage)) {
        event.preventDefault();
      }
    });
  });
</script>

{% endblock %}
